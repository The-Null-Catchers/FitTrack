name: fittrack
description: FitTrack — workouts, nutrition and progress tracking.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State management and routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.0.5

  # Local persistence
  # sqflite is used directly rather than through Drift/Isar so the build needs
  # no code generation step — see docs/ARCHITECTURE.md for the rationale.
  sqflite: ^2.3.3+1
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  flutter_secure_storage: ^9.2.2

  # UI
  fl_chart: ^0.69.0
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  file_picker: ^8.1.6
  intl: ^0.19.0

  # Platform integration
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  package_info_plus: ^8.0.2
  url_launcher: ^6.3.0

dev_dependencies:
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  # Runs the real sqflite engine on the test host, so the offline DAOs are
  # exercised against actual SQLite rather than a stand-in.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - lib/l10n/
    - assets/demo/
