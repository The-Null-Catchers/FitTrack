name: Release Android

# Manual only. A run produces a signed, installable artefact, so it never
# fires off a push.
on:
  workflow_dispatch:
    inputs:
      build_aab:
        description: "Also build an AAB (for a Play listing)"
        type: boolean
        required: true
        default: false
      version_name:
        description: "Version name, e.g. 1.0.1 (blank keeps pubspec's)"
        required: false
        default: ""

concurrency:
  group: release-android
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.27.4"

jobs:
  build:
    name: Build a signed release
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Fail early and clearly when a secret is missing, rather than silently
      # falling back to the debug key and shipping an APK that cannot update
      # anything.
      - name: Check the signing secrets are present
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing ANDROID_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing ANDROID_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing"
            exit 1
          fi
          echo "All four signing secrets are set."

      # The keystore is written outside the workspace so it cannot be picked up
      # by a later step, an artifact upload, or an accidental `git add`.
      - name: Materialise the keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          install -d -m 700 "$RUNNER_TEMP/signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          chmod 600 "$RUNNER_TEMP/signing/release.jks"
          # Size only — never the contents.
          echo "keystore bytes: $(stat -c%s "$RUNNER_TEMP/signing/release.jks")"

      - name: Set the version name
        if: ${{ inputs.version_name != '' }}
        run: |
          sed -i -E "s/^version: [^+]+\+/version: ${{ inputs.version_name }}+/" pubspec.yaml
          grep '^version:' pubspec.yaml

      # versionCode comes from the build number in pubspec (the part after +)
      # and must increase for every build a user might install over another.
      - name: Derive and bump versionCode from the run number
        run: |
          base=$(grep '^version:' pubspec.yaml | sed -E 's/.*\+([0-9]+).*/\1/')
          next=$(( base > GITHUB_RUN_NUMBER ? base : GITHUB_RUN_NUMBER ))
          sed -i -E "s/^(version: [^+]+)\+[0-9]+/\1+${next}/" pubspec.yaml
          echo "versionCode will be ${next}"
          grep '^version:' pubspec.yaml
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: Generate the platform folders
        run: ./tool/bootstrap_platforms.sh

      - name: Install
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build the APK
        env:
          FITTRACK_KEYSTORE: ${{ runner.temp }}/signing/release.jks
          FITTRACK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FITTRACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FITTRACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://unused.invalid

      - name: Build the AAB
        if: ${{ inputs.build_aab }}
        env:
          FITTRACK_KEYSTORE: ${{ runner.temp }}/signing/release.jks
          FITTRACK_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FITTRACK_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FITTRACK_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release \
            --dart-define=API_BASE_URL=https://unused.invalid

      # Proves the artefact carries YOUR certificate, not a debug key. The
      # fingerprint is public information — it is in every copy of the APK —
      # so printing it leaks nothing.
      - name: Verify the signature and record the fingerprint
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=build/app/outputs/flutter-apk/app-release.apk
          "$BT/apksigner" verify --verbose --print-certs "$APK" \
            | grep -E 'Verifies|scheme|DN:|SHA-256 digest'
          "$BT/zipalign" -c -P 16 4 "$APK" && echo "16 KB page aligned: OK"
          "$BT/aapt2" dump badging "$APK" \
            | grep -oE "package: name='[^']+' versionCode='[0-9]+' versionName='[^']+'"
          {
            echo "## Signed release"
            echo ""
            echo '```'
            "$BT/apksigner" verify --print-certs "$APK" | grep -E 'DN:|SHA-256 digest'
            "$BT/aapt2" dump badging "$APK" | grep -oE "versionCode='[0-9]+'"
            echo "sha256: $(sha256sum "$APK" | cut -d' ' -f1)"
            echo '```'
            echo ""
            echo "Check the certificate digest matches your keystore. If it"
            echo "changes between releases, an update will be refused."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Checksums
        run: |
          sha256sum build/app/outputs/flutter-apk/app-release.apk > SHA256SUMS.txt
          if [ -f build/app/outputs/bundle/release/app-release.aab ]; then
            sha256sum build/app/outputs/bundle/release/app-release.aab >> SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: fittrack-release
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
            apps/mobile/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

      # Belt and braces: the keystore lives in RUNNER_TEMP, which GitHub
      # discards with the runner, but remove it explicitly so it cannot be
      # reached by anything that runs after this job's steps.
      - name: Shred the keystore
        if: always()
        run: shred -u "$RUNNER_TEMP/signing/release.jks" 2>/dev/null || rm -f "$RUNNER_TEMP/signing/release.jks"
