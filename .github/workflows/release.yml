name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.27.4"
  REGISTRY: ghcr.io
  HAS_ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

jobs:
  images:
    name: Publish container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: API metadata
        id: api-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-api
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push the API image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: true
          tags: ${{ steps.api-meta.outputs.tags }}
          labels: ${{ steps.api-meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Admin metadata
        id: admin-meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-admin
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push the admin image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin
          push: true
          tags: ${{ steps.admin-meta.outputs.tags }}
          labels: ${{ steps.admin-meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'https://api.fittrack.app' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    name: Build the Android app
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create/update a GitHub Release for v* tags
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the platform folders
        run: ./tool/bootstrap_platforms.sh

      - run: flutter pub get

      - name: Require complete signing credentials for tagged releases
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" || -z "$STORE_PASSWORD" ]]; then
            echo "::error::Tagged Android releases require all four signing secrets."
            exit 1
          fi

      - name: Decode the signing keystore
        # Signed builds happen only when the secrets exist; forks and PRs fall
        # back to a debug-signed APK. No key material is ever committed.
        id: signing
        if: ${{ env.HAS_ANDROID_KEYSTORE == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
          echo "FITTRACK_KEYSTORE=$PWD/android/app/upload-keystore.jks" >> "$GITHUB_ENV"
          echo "FITTRACK_KEYSTORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "FITTRACK_KEY_ALIAS=$KEY_ALIAS" >> "$GITHUB_ENV"
          echo "FITTRACK_KEY_PASSWORD=$KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "::add-mask::$STORE_PASSWORD"
          echo "::add-mask::$KEY_PASSWORD"
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build the APK
        run: >-
          flutter build apk --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.fittrack.app' }}

      - name: Build the app bundle
        run: >-
          flutter build appbundle --release
          --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.fittrack.app' }}

      - name: Verify release APK signature
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$SIGNER"
          "$SIGNER" verify --verbose "$APK"
          # Confirm the APK was signed by the configured upload key, not a debug fallback.
          EXPECTED=$(keytool -exportcert \
            -keystore android/app/upload-keystore.jks \
            -storepass "$FITTRACK_KEYSTORE_PASSWORD" \
            -alias "$FITTRACK_KEY_ALIAS" | sha256sum | cut -d ' ' -f 1)
          ACTUAL=$("$SIGNER" verify --print-certs "$APK" \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d '\\r')
          if [[ -z "$ACTUAL" || "${EXPECTED,,}" != "${ACTUAL,,}" ]]; then
            echo "::error::APK signing certificate differs from configured upload keystore."
            exit 1
          fi
          echo "APK signing certificate matches the configured upload keystore."

      - name: Remove the signing material
        if: always()
        run: rm -f android/app/upload-keystore.jks

      - uses: actions/upload-artifact@v4
        with:
          name: fittrack-android
          path: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      - name: Attach the build to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            apps/mobile/build/app/outputs/flutter-apk/app-release.apk
            apps/mobile/build/app/outputs/bundle/release/app-release.aab
