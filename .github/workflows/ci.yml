name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push supersedes an in-flight run on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"
  FLUTTER_VERSION: "3.27.4"

jobs:
  api:
    name: API — lint, format, tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check app tests

      - name: Format
        run: ruff format --check app tests

      - name: Tests
        # The suite runs on in-memory SQLite, so no services are needed.
        env:
          ENVIRONMENT: test
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          RATE_LIMIT_ENABLED: "false"
          JWT_SECRET: ci-secret-not-used-in-any-real-environment
        run: pytest -q --cov=app --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-coverage
          path: services/api/coverage.xml
          if-no-files-found: ignore

  migrations:
    name: API — migrations against PostgreSQL
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fittrack
          POSTGRES_PASSWORD: fittrack
          POSTGRES_DB: fittrack
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fittrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/api/pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Apply migrations
        env:
          DATABASE_URL: "postgresql+asyncpg://fittrack:fittrack@localhost:5432/fittrack"
        run: alembic upgrade head

      - name: Check the schema matches the models
        # An empty autogenerate diff proves no migration was forgotten.
        env:
          DATABASE_URL: "postgresql+asyncpg://fittrack:fittrack@localhost:5432/fittrack"
        run: |
          alembic check

      - name: Seed reference data
        env:
          DATABASE_URL: "postgresql+asyncpg://fittrack:fittrack@localhost:5432/fittrack"
        run: python -m app.seeds

  admin:
    name: Admin — lint, typecheck, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/admin
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: apps/admin/package-lock.json

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  mobile:
    name: Mobile — analyze and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the platform folders
        run: ./tool/bootstrap_platforms.sh

      - name: Install
        run: flutter pub get

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        # Lints are advisory here; only genuine errors fail the build.
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Tests
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-coverage
          path: apps/mobile/coverage/lcov.info
          if-no-files-found: ignore

  android:
    name: Android — release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5

      # Matches the JDK the release workflow builds with, so a Gradle or AGP
      # problem shows up here rather than during a release run.
      #
      # No `cache: gradle` here: that looks for Gradle files the moment this
      # action runs, and android/ does not exist yet — bootstrap_platforms.sh
      # generates it further down — so the action fails the job outright. The
      # dependency cache is handled below instead.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Keyed on what actually determines the plugin set: the resolved Dart
      # dependencies, and the bootstrap script that pins the Gradle wrapper and
      # AGP versions. Keying on the generated Gradle files is not possible,
      # since they do not exist until after this step.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('apps/mobile/pubspec.lock', 'apps/mobile/tool/bootstrap_platforms.sh') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Generate the platform folders
        run: ./tool/bootstrap_platforms.sh

      - name: Install
        run: flutter pub get

      # FITTRACK_KEYSTORE is deliberately unset, so the signing config falls
      # back to the debug key and this needs no secrets. It proves the release
      # build compiles and that the signing config is wired; it does not prove
      # anything about the real signing key, which only the release workflow
      # holds.
      - name: Build the release APK
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=https://unused.invalid

      # Asserts the two things worth asserting — the APK exists, and it carries
      # native libraries for at least one ABI, since `flutter build apk` without
      # `--split-per-abi` is expected to produce one universal APK. The
      # certificate and badging lines are informational, so a change in a tool's
      # output format cannot fail the build on its own.
      - name: Report what was built
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          ls -l "$APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/aapt2" dump badging "$APK" | grep -E '^package:' || true
          ABIS=$(unzip -l "$APK" | grep -oE 'lib/[^/]+/' | sort -u || true)
          echo "ABIs carried by the APK:"
          echo "$ABIS"
          test -n "$ABIS"
          # Always says something. The previous version piped apksigner into
          # grep and ended with `|| true`, so when apksigner could not be run at
          # all the step printed a heading and nothing else — a missing tool and
          # an unsigned APK looked exactly alike, and the `|| true` threw away
          # the error that would have said which. stderr is folded in and the
          # outcome is stated in every branch, including which binary was used.
          echo "signing certificate (the DEBUG key here, never the release key):"
          SIGNER="$BT/apksigner"
          if [ ! -x "$SIGNER" ]; then
            SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f 2>/dev/null | sort -V | tail -1)
          fi
          if [ -n "$SIGNER" ] && [ -x "$SIGNER" ]; then
            echo "  using $SIGNER"
            "$SIGNER" verify --verbose --print-certs "$APK" 2>&1 \
              | grep -E 'Signer|Verifies|Verified using|Error|Exception' \
              || echo "  apksigner ran but reported nothing recognisable"
          else
            echo "  no apksigner under $ANDROID_HOME/build-tools, so the signer is unreported"
            ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null \
              | sed 's/^/    build-tools present: /' || true
          fi

      # The APK is not uploaded on purpose. It is signed with the debug key, so
      # installing it would block the update path for a properly signed release
      # on the same device: Android refuses an update whose key differs, and the
      # only way out is an uninstall, which erases local data. The signed
      # artefact comes from the Release Android workflow and nowhere else.

  docker:
    name: Docker — build images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./services/api
          push: false
          load: true
          tags: fittrack-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the admin image
        uses: docker/build-push-action@v6
        with:
          context: ./apps/admin
          push: false
          load: true
          tags: fittrack-admin:ci
          build-args: NEXT_PUBLIC_API_URL=http://localhost:8000
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the API image
        run: |
          # No database is attached, so /health (liveness) must answer while
          # /ready (readiness) reports the missing dependency.
          docker run -d --name fittrack-api-ci \
            -e ENVIRONMENT=test \
            -e DATABASE_URL=sqlite+aiosqlite:///./var/ci.db \
            -e JWT_SECRET=ci-secret \
            -p 8000:8000 \
            fittrack-api:ci \
            uvicorn app.main:app --host 0.0.0.0 --port 8000
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /dev/null; then
              echo "API is up."
              curl -fsS http://localhost:8000/health
              exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy." >&2
          docker logs fittrack-api-ci
          exit 1

  compose:
    name: Docker Compose — config is valid
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate the development stack
        run: docker compose config --quiet
      - name: Validate the production overlay
        env:
          DATABASE_URL: "postgresql+asyncpg://user:pass@db:5432/fittrack"
          JWT_SECRET: validation-only
          CORS_ORIGINS: https://example.com
          API_IMAGE: ghcr.io/example/fittrack-api:ci-validation
          ADMIN_IMAGE: ghcr.io/example/fittrack-admin:ci-validation
        run: >-
          docker compose
          -f docker-compose.yml
          -f infra/docker/docker-compose.prod.yml
          config --quiet

  acceptance:
    name: Acceptance — full stack walk-through
    runs-on: ubuntu-latest
    needs: [api, admin]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Start the stack
        run: |
          cp .env.example .env
          docker compose up -d --build postgres redis minio minio-init api worker

      - name: Seed reference and demo data
        run: docker compose run --rm api seed --demo

      - name: Walk the acceptance criteria
        run: |
          python -m pip install --quiet httpx pillow
          FITTRACK_URL=http://localhost:8000 python scripts/acceptance.py

      - name: Service logs on failure
        if: failure()
        run: docker compose logs --tail=200 api worker

      - name: Tear down
        if: always()
        run: docker compose down -v
