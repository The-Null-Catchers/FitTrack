# FitTrack API — Fly.io deployment.
#
# Deploy from this directory (the Dockerfile's build context is services/api):
#   fly deploy --remote-only
#
# `--remote-only` builds on Fly's builders, so no local Docker daemon is needed.
#
# Secrets are NEVER set here. They live in `fly secrets`, which injects them as
# environment variables at runtime and keeps them out of the image and out of
# Git. See scripts/deploy-fly.sh.

app = "fittrack-api"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[processes]
  # The entrypoint runs `alembic upgrade head` before serving, so a deploy
  # migrates. Keep the API at one machine while that is true: concurrent
  # migrations on boot would race.
  app = "api"
  worker = "worker"

[env]
  ENVIRONMENT = "production"
  DEBUG = "false"
  LOG_LEVEL = "INFO"
  API_V1_PREFIX = "/api/v1"
  WEB_CONCURRENCY = "2"

  # Object storage on disk, under the mounted volume below. Switch to
  # STORAGE_BACKEND=s3 with Tigris if this ever needs more than one machine —
  # a Fly volume attaches to exactly one.
  STORAGE_BACKEND = "local"
  STORAGE_LOCAL_PATH = "/srv/app/var/storage"

  # FitCoach runs on canned responses. The safety layer and the rules-based
  # plan generator are unaffected — neither calls a provider.
  AI_PROVIDER = "mock"
  EMAIL_PROVIDER = "console"
  PUSH_PROVIDER = "console"

  RATE_LIMIT_ENABLED = "true"
  RATE_LIMIT_DEFAULT = "300/minute"
  RATE_LIMIT_AUTH = "10/minute"
  RATE_LIMIT_AI = "30/hour"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "30s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/health"

# Progress photos and any other uploads live here. Without this volume the
# filesystem is ephemeral and every deploy would drop them.
[[mounts]]
  source = "fittrack_storage"
  destination = "/srv/app/var"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
  processes = ["worker"]
