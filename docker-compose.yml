# FitTrack local development stack.
# Infrastructure ports are loopback-only by default; services communicate on the Compose network.
#
#   docker compose up -d
#   docker compose run --rm api seed --demo
#
# The API waits for PostgreSQL, applies migrations and then serves on :8000.
name: fittrack

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://fittrack:fittrack@postgres:5432/fittrack
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_ENDPOINT: http://minio:9000
  # Presigned URLs are signed for the host they name, and `minio` resolves only
  # between these containers. Clients get the published address instead.
  S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-http://localhost:${MINIO_PORT:-9000}}
  S3_BUCKET: ${S3_BUCKET:-fittrack}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fittrack}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-fittrack-dev-secret}
  S3_USE_PATH_STYLE: "true"
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  PUSH_PROVIDER: ${PUSH_PROVIDER:-console}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack
      POSTGRES_DB: fittrack
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fittrack -d fittrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Source-built, commit-pinned MinIO avoids withdrawn/restricted binary image registries.
  minio:
    build:
      context: .
      dockerfile: infra/docker/minio.Dockerfile
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fittrack}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-fittrack-dev-secret}
    ports:
      - "127.0.0.1:${MINIO_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # Reuse the API image's boto3 client to initialize the bucket after MinIO starts.
  minio-init:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    entrypoint: ["python", "/bootstrap/init_minio.py"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fittrack}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-fittrack-dev-secret}
      S3_BUCKET: ${S3_BUCKET:-fittrack}
    volumes:
      - ./infra/docker/init_minio.py:/bootstrap/init_minio.py:ro
    depends_on:
      minio:
        condition: service_started
    restart: "no"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ["api"]
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - api-storage:/srv/app/var/storage
    restart: unless-stopped

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ["worker"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-storage:/srv/app/var/storage
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-storage:
