# FitTrack local development stack.
#
#   docker compose up -d
#   docker compose run --rm api seed --demo
#
# The API waits for PostgreSQL, applies migrations and then serves on :8000.
name: fittrack

x-api-env: &api-env
  ENVIRONMENT: ${ENVIRONMENT:-development}
  DEBUG: ${DEBUG:-true}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: postgresql+asyncpg://fittrack:fittrack@postgres:5432/fittrack
  REDIS_URL: redis://redis:6379/0
  JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
  APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:3000}
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-fittrack}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:-fittrack}
  S3_SECRET_KEY: ${S3_SECRET_KEY:-fittrack-dev-secret}
  S3_USE_PATH_STYLE: "true"
  AI_PROVIDER: ${AI_PROVIDER:-mock}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  PUSH_PROVIDER: ${PUSH_PROVIDER:-console}

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fittrack
      POSTGRES_PASSWORD: fittrack
      POSTGRES_DB: fittrack
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fittrack -d fittrack"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3-compatible object storage for avatars, exercise media and progress photos.
  # Pulled from quay.io, which is where MinIO publishes: the Docker Hub
  # repositories (minio/minio, minio/mc) have been withdrawn and no longer
  # resolve at all.
  minio:
    image: quay.io/minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-fittrack}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-fittrack-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Creates the bucket on first run, then exits.
  minio-init:
    image: quay.io/minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-fittrack} ${S3_SECRET_KEY:-fittrack-dev-secret} &&
      mc mb --ignore-existing local/${S3_BUCKET:-fittrack} &&
      mc anonymous set download local/${S3_BUCKET:-fittrack}/exercise-media &&
      mc anonymous set download local/${S3_BUCKET:-fittrack}/avatars &&
      echo 'Bucket ready.'
      "
    restart: "no"

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ["api"]
    environment: *api-env
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    volumes:
      - api-storage:/srv/app/var/storage
    restart: unless-stopped

  worker:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    command: ["worker"]
    environment: *api-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - api-storage:/srv/app/var/storage
    restart: unless-stopped

  admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "${ADMIN_PORT:-3000}:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:
  api-storage:
