# Production overlay for a single-host deployment.
#
#   docker compose -f docker-compose.yml -f infra/docker/docker-compose.prod.yml up -d
#
# Differences from the development stack: images come from a registry rather
# than a local build, nothing is bind-mounted, ports are not published except
# through nginx, and secrets come from the environment with no defaults.
name: fittrack

services:
  postgres:
    ports: []
    restart: always

  redis:
    ports: []
    restart: always

  minio:
    ports: []
    restart: always

  api:
    image: ${API_IMAGE:-ghcr.io/archipelago-alt/fittrack-api:latest}
    build: !reset null
    ports: []
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      # Public address of object storage, written into the URLs clients get.
      # The development default (localhost:9000) must not leak into production,
      # so it is passed through explicitly and defaults to empty, which falls
      # back to S3_ENDPOINT. Set it when STORAGE_BACKEND=s3: presigned URLs are
      # signed for the host they name, so it has to be one clients can reach.
      # Note the bundled MinIO publishes no ports here and nginx does not route
      # to it, so serving media from it needs a public route you add. Either use
      # an external S3-compatible service, or STORAGE_BACKEND=local, which nginx
      # already serves through /media.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
    restart: always
    deploy:
      resources:
        limits:
          memory: 1g

  worker:
    image: ${API_IMAGE:-ghcr.io/archipelago-alt/fittrack-api:latest}
    build: !reset null
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      # As above: the worker mints media URLs too, so it needs the same value.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
    restart: always

  admin:
    image: ${ADMIN_IMAGE:-ghcr.io/archipelago-alt/fittrack-admin:latest}
    build: !reset null
    ports: []
    restart: always

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/proxy_params.conf:/etc/nginx/proxy_params.conf:ro
      - ${TLS_CERT_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      - api
      - admin
    restart: always
