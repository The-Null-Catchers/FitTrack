# Reverse proxy for a single-host production deployment.
#
#   /api/      -> FastAPI
#   /fittrack/ -> MinIO, so presigned media URLs resolve (see below)
#   /          -> Next.js admin dashboard
#
# TLS is expected to be terminated here; certificates are mounted at
# /etc/nginx/certs. For a managed platform (Fly, Render, Cloud Run) this file
# is unnecessary — the platform's router replaces it.

worker_processes auto;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    server_tokens off;

    # Uploads are capped in the application too; this is the edge guard.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    log_format json escape=json '{"time":"$time_iso8601","remote_addr":"$remote_addr",'
        '"method":"$request_method","uri":"$uri","status":$status,'
        '"bytes":$body_bytes_sent,"duration":$request_time,'
        '"request_id":"$http_x_request_id"}';
    access_log /var/log/nginx/access.log json;

    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=1r/s;

    upstream fittrack_api {
        server api:8000;
        keepalive 32;
    }

    upstream fittrack_admin {
        server admin:3000;
        keepalive 16;
    }

    upstream fittrack_storage {
        server minio:9000;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;

        # Health checks must stay reachable over plain HTTP.
        location = /health {
            proxy_pass http://fittrack_api/health;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;

        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;

        location /api/v1/auth/ {
            limit_req zone=auth burst=10 nodelay;
            proxy_pass http://fittrack_api;
            include /etc/nginx/proxy_params.conf;
        }

        location /api/ {
            limit_req zone=api burst=60 nodelay;
            proxy_pass http://fittrack_api;
            include /etc/nginx/proxy_params.conf;
        }

        location ~ ^/(docs|redoc|openapi.json|health|ready|media)/? {
            proxy_pass http://fittrack_api;
            include /etc/nginx/proxy_params.conf;
        }

        # Object storage, so presigned media URLs resolve for real clients.
        #
        # SigV4 signs the host and the path, so both must reach MinIO exactly
        # as the client received them. That is why this is the bucket path
        # rather than a tidier prefix: strip or rewrite anything and MinIO
        # recomputes a different signature and answers 403. A proxy_pass with
        # no URI part leaves the path alone; the Host is handled below.
        #
        # THIS LOCATION IS THE BUCKET NAME: keep it in step with S3_BUCKET.
        # Set S3_PUBLIC_ENDPOINT to this server's origin, with no path suffix.
        #
        # `^~` keeps a later regex location from capturing media by accident.
        location ^~ /fittrack/ {
            # The app only ever mints presigned GETs. Refuse the rest at the
            # edge instead of relying on bucket policy alone.
            limit_except GET HEAD {
                deny all;
            }

            proxy_pass http://fittrack_storage;

            # Deliberately not proxy_params.conf: that sends `Host $host`,
            # which drops the port. SigV4 signs the Host header verbatim, so
            # a non-default port has to survive or MinIO rebuilds a different
            # canonical request and rejects the signature. $http_host is the
            # header exactly as the client sent it.
            proxy_http_version 1.1;
            proxy_set_header Connection        "";
            proxy_set_header Host              $http_host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_connect_timeout 10s;

            # Media is large and already signed; stream it, and let the
            # storage layer's own cache headers through untouched.
            proxy_buffering off;
        }

        location / {
            proxy_pass http://fittrack_admin;
            include /etc/nginx/proxy_params.conf;
        }
    }
}
